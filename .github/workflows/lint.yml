name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Run the pre-commit hooks so CI uses the same pinned ruff and the same
      # file selection as contributors' local hooks.
      - name: ruff check
        run: uvx pre-commit@4.7.0 run ruff-check --all-files --show-diff-on-failure
      - name: ruff format
        if: ${{ !cancelled() }}
        run: uvx pre-commit@4.7.0 run ruff-format --all-files --show-diff-on-failure
