name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: docs/requirements.txt
      - name: Install documentation dependencies
        run: |
          uv venv --python 3.12 .local/docs-venv
          uv pip install --python .local/docs-venv/bin/python -r docs/requirements.txt
      - name: Build the documentation
        run: |
          .local/docs-venv/bin/python -m sphinx -E -a -b html -n -W --keep-going \
            -d docs/_build/doctrees docs docs/_build/site/docs
          cp -a docs/_hosting/. docs/_build/site/
          printf '{"repository":"mlc-ai/TIRx-harness","commit":"%s"}\n' "$GITHUB_SHA" > docs/_build/site/source.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_build/site
          retention-days: 0 # Use the repository's default artifact retention.

  publish:
    if: github.repository == 'mlc-ai/TIRx-harness' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
