[package]
name = "numsim-tirx-frontend"
version = "0.2.4"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# rc1 has the same compiler bindings as rc0 and is published on crates.io.
tvm-tirx = "=0.1.0-rc1"

# The dispatch macro resolves ::tvm_ffi; match tvm-tirx's registry dependency.
tvm-ffi = "=0.1.16-rc4"

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = "1.0.109"

[profile.release]
strip = "debuginfo"

[workspace]
