[package]
name = "numsim-tirx-frontend"
version = "0.2.4"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# The rc0 source still declares alpha.5, so pin its commit, not the older crates.io release.
# This is apache/tvm-tirx tag v0.1.0-rc0, matching apache-tvm-tirx==0.1.0rc0.
tvm-tirx = { git = "https://github.com/apache/tvm-tirx.git", rev = "ba2310de3ca9607db77b369b0857f0f8d293d34b" }

# The dispatch macro resolves ::tvm_ffi; use the same pinned source as tvm-tirx.
tvm-ffi = { git = "https://github.com/apache/tvm-tirx.git", rev = "ba2310de3ca9607db77b369b0857f0f8d293d34b" }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = "1.0.109"

[profile.release]
strip = "debuginfo"

[workspace]
