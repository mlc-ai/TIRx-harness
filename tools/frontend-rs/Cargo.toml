[package]
name = "numsim-tirx-frontend"
version = "0.2.4"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# setup.py stages and version-checks the pinned submodule beside this manifest.
tvm = { package = "tvm-rust", path = "thirdparty/tvm-rust-ext" }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = "1.0.109"

[profile.release]
strip = "debuginfo"

[workspace]
exclude = ["thirdparty/tvm-rust-ext"]
