[package]
name = "numsim-tirx-frontend"
version = "0.2.4"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# An exact pin: the bindings mirror the object layouts of one apache-tvm-tirx release.
tvm-tirx = "=0.1.0-alpha.5"

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = "1.0.109"

[profile.release]
strip = "debuginfo"

[workspace]
