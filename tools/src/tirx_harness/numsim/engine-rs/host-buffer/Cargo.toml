[package]
name = "numsim-host-buffer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pyo3 = { version = "=0.29.0" }

# Production artifacts are loaded by an already running Python interpreter.
# Only standalone Rust tests need to initialize an embedded interpreter.
[dev-dependencies]
pyo3 = { version = "=0.29.0", features = ["auto-initialize"] }
