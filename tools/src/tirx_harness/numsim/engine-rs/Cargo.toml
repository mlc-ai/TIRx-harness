[package]
name = "numsim-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "numsim_engine"
path = "src/lib.rs"

[features]
default = []
python = ["dep:numsim-host-buffer", "dep:pyo3"]
profile = []
# `analysis` remains the compatibility umbrella. Synccheck artifacts request
# only `analysis-core`, so the Racecheck/global-shadow implementation does not
# inflate their dependency metadata or specialization time.
analysis-core = []
racecheck = ["analysis-core"]
analysis = ["racecheck"]

[dependencies]
libm = "=0.2.16"
numsim-fp-env = { path = "fp-env" }
numsim-host-buffer = { path = "host-buffer", optional = true }
pyo3 = { version = "=0.29.0", optional = true }
thread_local = "1.1"

# Production artifacts are loaded by an already running Python interpreter.
# Only standalone Rust tests need to initialize an embedded interpreter.
[dev-dependencies]
pyo3 = { version = "=0.29.0", features = ["auto-initialize"] }
