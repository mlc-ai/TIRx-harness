name: msa_prefill
workload_dir: candidates/msa/prefill
kernel_authoring: TIRx-lite
sota_baseline:
  name: minimax_sparse_atten_func
bench_timeout_s: 300
banned_paths:
  - tirx-kernels/tirx_kernels/msa/**
  - tirx-kernels/tirx_kernels/ported/msa/**
  - tirx-kernels/.agents/sketch/msa/**
spec: |
  Implement MiniMax sparse attention prefill on B200 (sm_100) with the
  msa_sparse_attention contract. Beat the packaged baseline:
  MiniMax fmha_sm100 sparse_atten_func on the
  bf16/fp8 rows with GQA ratio 8 or 16, and flashinfer's TensorRT-LLM
  block-sparse decode bridge (one request per query token) on the paged
  Hq8/Hkv2 row, where MiniMax's kernel does not compile. Use the packaged
  baseline for scoring.

  Inputs, in order, are q, k, v, q2k_indices, cu_seqlens_q, cu_seqlens_k,
  page_table, seqused_k, softmax_scale. q is contiguous [Q,Hq,128]. Flat K/V
  have shape [total_k,Hkv,128]; paged K/V have shape [num_pages,Hkv,128,128]
  with 128 tokens per page. q is bf16 or fp16; K/V use q's dtype, or
  fp8_e4m3fn with bf16 q (plain cast, no extra scales). Hq is divisible by
  Hkv. Output has q's shape and dtype, and inputs must remain unchanged.
  q2k_indices is int32[Hkv,Q,topk]: ascending sequence-local KV block ids,
  padded with -1. cu_seqlens_q is int32[B+1]. For flat KV, cu_seqlens_k is
  int32[B+1] and page_table/seqused_k are None. For paged KV, cu_seqlens_k
  is None, page_table int32[B,max_pages] maps sequence-local block ids to
  physical pages, and seqused_k int32[B] gives each sequence's valid KV
  length. softmax_scale is fp32, officially 1/sqrt(128).

  Query head h uses KV head h//(Hq/Hkv). Token i of sequence b may attend
  only selected blocks' valid tokens at positions <= kv_len[b]-q_len[b]+i
  (bottom-right causal masking). Compute softmax(softmax_scale*q@k.T)@v
  over those tokens. An empty selection returns zeros. Partial final pages
  and -1 padding must never contribute.

  The three official rows are: flat bf16 B1/Q4096/KV4096/Hq64/Hkv4/topk16;
  flat bf16-query/fp8-KV B3/Q1024/KV8192/Hq32/Hkv2/topk8; and paged bf16
  B3/Q4096/KV8192/Hq8/Hkv2/topk4 (Q here is per sequence).

  Version contract: solution.py exports setup(data, total_q, B) -> callable.
  data contains the nine inputs above and preallocated output. setup may
  compile, allocate scratch and shape-only metadata, and execute one warmup
  call. Each timed call must consume current selection/length/page metadata,
  perform data-dependent preparation, and overwrite output. The adapter
  returns (data['output'],). Do not call FlashInfer, MiniMax MSA, PyTorch
  tensor operators, Triton, CUTE DSL, raw CUDA, or existing solution kernels
  for production computation.

  Correctness uses an independent sparse-attention oracle, with expected
  output cast to q's dtype. PyTorch's additive atol+rtol*abs(reference)
  criterion applies in the output's native dtype on every element:
  atol=rtol=0.01 for bf16/fp16 KV and atol=rtol=0.1 for fp8 KV.
  The normalized RMS error ratio must also stay below 1e-2.
  Repeated numerical checks and output poisoning
  remain enabled. The adapter
  scores all three official rows. Scoring is packaged baseline latency /
  candidate latency.
